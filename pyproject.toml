[project]
name = "draft-optimizer"
version = "1.0.0"
description = "Fantasy football live-draft assistant: tells you exactly who to pick next"
readme = "README.md"
authors = [
    { name = "Rob Enderle", email = "robenderleamd@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
draft-optimizer = "draft_optimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draft_optimizer"]
